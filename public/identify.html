<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--color-dim);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .card {
    position: relative;
    z-index: 1;
    padding: 32px 56px;
    border-radius: 20px;
    background: var(--color-bg);
    border: 3px solid var(--color-border);
    text-align: center;
    animation: pulse 1.4s ease-in-out infinite alternate;
    box-shadow: 0 0 40px var(--color-glow);
  }
  h1 {
    font-size: clamp(2rem, 5vw, 4.5rem);
    margin: 0 0 8px;
    color: #fff;
    text-shadow: 0 2px 8px var(--color);
  }
  p {
    font-size: clamp(1rem, 2vw, 1.5rem);
    opacity: 0.9;
    color: #fff;
    text-shadow: 0 1px 4px var(--color);
    margin: 0;
  }
  @keyframes pulse {
    from { transform: scale(1); opacity: 1; box-shadow: 0 0 40px var(--color-glow); }
    to   { transform: scale(1.04); opacity: 0.85; box-shadow: 0 0 60px var(--color-alpha); }
  }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="card"><h1 id="name"></h1><p id="desc"></p></div>
<script>
  window.applyIdentity = function (color, name) {
    var root = document.documentElement.style;
    root.setProperty('--color', color);
    root.setProperty('--color-dim', color + '18');
    root.setProperty('--color-bg', color + '1A');
    root.setProperty('--color-border', color + '88');
    root.setProperty('--color-glow', color + '44');
    root.setProperty('--color-alpha', color + '66');
    document.getElementById('name').textContent = name;
    document.getElementById('desc').textContent = 'This is your ' + name;
  };
</script>
</body>
</html>
