# Included by every location in nginx.conf. nginx only inherits add_header
# into a location that sets none of its own, so declaring these once at the
# server level silently dropped them from every JS, CSS and JSON response.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# fly.toml sets force_https, so every visit is HTTPS; keep it that way.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content Security Policy, report-only for now: browsers log violations to the
# console but block nothing, so it can be checked against real use (Clerk,
# Convex, Paystack, embeds, the CDN-loaded model) before it is enforced. The
# part that matters for XSS is script-src; connect-src stays open to any HTTPS
# host because the LLM endpoint is user-configurable. To enforce, rename the
# header to Content-Security-Policy.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://www.youtube.com https://player.vimeo.com https://*.clerk.accounts.dev https://checkout.paystack.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
