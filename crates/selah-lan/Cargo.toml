[package]
name = "selah-lan"
version = "0.1.0"
edition = "2021"
description = "Selah on the local network: the desk announces itself, phones find it"
license = "MIT"

[dependencies]
if-addrs = "0.15"
mdns-sd = "0.21"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
