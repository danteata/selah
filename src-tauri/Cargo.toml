[package]
name = "selah"
version = "0.1.17"
description = "Selah - Church Presentation Software"
authors = ["Selah Team"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["webview-data-url", "macos-private-api", "protocol-asset", "devtools", "tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "zstd"] }
cpal = "0.15"
rubato = "0.15"  # For audio resampling
parking_lot = "0.12"  # For thread-safe mutex
lazy_static = "1.4"
base64 = "0.22"  # For encoding audio to base64 + decoding signed license files
ed25519-dalek = "2"  # Offline Ed25519 verification of signed license files
hound = "3.5"  # For WAV encoding
sha2 = "0.10"  # SHA-256 verification for model downloads
flate2 = "1.0"  # gzip decompression for Parakeet model tarballs
tar = "0.4"  # tar extraction for Parakeet model tarballs
scopeguard = "1.2.0"  # For RAII guards (COM cleanup, etc.)
anyhow = "1"  # Ergonomic error handling in the native transcription engine
tiny_http = "0.12"  # One-shot HTTP listener for the OAuth callback (port 19888)
ort = "2.0.0-rc.11"  # ONNX Runtime for Silero VAD
ndarray = "0.17"  # For tensor operations with ort (must match ort's ndarray version)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = "0.4"  # For date-based log rotation
# NDI is loaded at runtime (see ndi_output/ndi_lib.rs), so there is no NDI SDK
# dependency at build time and a missing runtime cannot stop the app launching.
libloading = { version = "0.8", optional = true }
# In-process transcription engine. Whisper-family (GGUF) models run through
# transcribe-cpp; transcribe-rs is ONNX-only (Parakeet, Moonshine, SenseVoice,
# GigaAM, Canary, Cohere). Optional + behind the `native-transcription` feature
# so the default build and the existing Python sidecar path are completely
# unaffected until cutover. Per-platform GPU backends are added in the target
# tables below.
transcribe-rs = { version = "0.3.8", features = ["onnx"], optional = true }
transcribe-cpp = { version = "0.1", optional = true }

# Platform-specific dependencies for system audio capture
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "0.3"  # macOS 12.3+ system audio capture
core-foundation = "0.10"  # CFError type from screencapturekit
core-media-rs = "0.3"    # RetainedAudioBufferList from screencapturekit
core-audio-types-rs = "0.3"  # AudioBuffer type
transcribe-cpp = { version = "0.1", features = ["metal"], optional = true }  # Metal GPU on macOS

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.22"  # WASAPI loopback for system audio capture
windows = { version = "0.58", features = [
    "Win32_System_Com",
    "Win32_Foundation",
    # IsWow64Process2 (resolved dynamically) for the emulated-on-ARM64 check in
    # `platform::is_windows_x64_emulated_on_arm64`.
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # Windows.Graphics.Capture pipeline for NDI output (ndi_output::capture_windows).
    # WebView2 renders through the GPU compositor, so GDI BitBlt/PrintWindow of the
    # live output window comes back black — WGC is the API that captures composited
    # windows correctly. All of these are feature gates on the `windows` crate that
    # is already vendored, not new dependencies.
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
# ONNX Runtime on Windows is CPU-only, matching macOS/Linux — there is
# deliberately no `ort-directml` here. The DirectML EP pulled in pyke's prebuilt
# ONNX Runtime, which is compiled with a global /arch:AVX2 baseline and executes
# BMI2/AVX instructions in a C++ static initializer — so it crashes at process
# startup, before main(), on any pre-Haswell CPU (Sandy/Ivy Bridge, older AMD).
# That is fatal for Selah specifically: `ort` is unified across transcribe-rs and
# our own Silero VAD dependency, so the crash takes down the whole app rather
# than just ONNX transcription, on exactly the aging hardware a church AV booth
# tends to run. Dropping the feature means we link a baseline ONNX Runtime
# dynamically (via ORT_LIB_LOCATION in build-desktop.yml) with proper runtime CPU
# dispatch, so it runs everywhere and still uses AVX2/AVX-512 kernels when the
# CPU has them. Base `transcribe-rs` (features = ["onnx"]) is inherited from
# [dependencies], so the ONNX engines still run on CPU.
transcribe-cpp = { version = "0.1", features = ["dynamic-backends", "vulkan"], optional = true }  # Vulkan on Windows

[target.'cfg(target_os = "linux")'.dependencies]
# NDI output captures the live output window with XComposite + MIT-SHM
# (ndi_output::capture_linux). x11-dl is already in the tree via tao/tauri and
# dlopens libX11/libXext at run time, so this adds no build-time dependency and
# nothing new for the AppImage to bundle; libc is for the shmget/shmat pair
# MIT-SHM needs.
x11-dl = "2.21"
libc = "0.2"
transcribe-cpp = { version = "0.1", features = ["dynamic-backends", "vulkan"], optional = true }  # Vulkan on Linux

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

[features]
# Native in-process transcription is now the default engine (transcribe-rs).
default = ["custom-protocol", "native-transcription", "ndi"]
custom-protocol = ["tauri/custom-protocol"]
ndi = ["dep:libloading"]
native-transcription = ["dep:transcribe-rs", "dep:transcribe-cpp"]
