name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          # macos-13 is the last Intel runner image — build x86_64 natively
          # there so Homebrew installs an x86_64 ONNX Runtime (arm64 runners
          # would give an arm64 dylib that can't link into an x86_64 binary).
          - platform: 'macos-13'
            target: 'x86_64-apple-darwin'
            name: 'macOS (Intel)'
            # `ort` publishes no prebuilt binary for Intel macOS, so this job
            # links a Homebrew-installed ONNX Runtime (see the "system ONNX
            # Runtime" step) and bundles its dylib via this config override.
            tauri_args: '--config src-tauri/tauri.onnxruntime-system.conf.json'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # whisper.cpp's Vulkan backend compiles its shaders with `glslc`, which
          # glslang-tools does NOT provide (that's only glslangValidator). The
          # LunarG `vulkan-sdk` meta-package bundles glslc + the loader + headers.
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            vulkan-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Activate the MSVC build environment so cl.exe + INCLUDE/LIB land on PATH.
      # whisper.cpp's Vulkan backend builds a host tool (vulkan-shaders-gen) via
      # a nested CMake ExternalProject; without the dev environment that nested
      # configure fails with "No CMAKE_C_COMPILER could be found". This action is
      # plain JS (no deprecated actions/cache), so resolving it doesn't break the
      # other jobs the way a Vulkan-setup action did.
      - name: Setup MSVC developer environment (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Build whisper.cpp with Ninja instead of the Visual Studio generator. The
      # VS generator builds whisper.cpp's vulkan-shaders-gen as a nested CMake
      # ExternalProject whose configure is re-invoked by MSBuild WITHOUT the VS
      # toolset context, so it fails "No CMAKE_C_COMPILER could be found". Ninja
      # uses cl.exe directly from PATH (provided by msvc-dev-cmd above) for both
      # the parent and the nested build, sidestepping the lost-toolset problem.
      - name: Force Ninja generator (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Install the Vulkan SDK with a plain `run:` step (NOT a third-party
      # action). GitHub resolves every `uses:` action in a job up front — even
      # `if:`-gated ones and their nested actions — so a Vulkan setup *action*
      # (and its deprecated actions/cache@v2 dependency) breaks the macOS job
      # too. A `run:` step is gated by `if:` and never resolved on other OSes.
      - name: Setup Vulkan SDK (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = '1.3.290.0'
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # Intel macOS has no prebuilt `ort` binary, so link a Homebrew ONNX
      # Runtime instead (ORT_STRATEGY=system). We stage a copy of the dylib with
      # an @rpath install-name and point ORT_LIB_LOCATION at it, so the linked
      # binary references @rpath/libonnxruntime.dylib — which the bundled .app
      # then resolves from Contents/Frameworks (see tauri.onnxruntime-system.conf.json).
      - name: Setup system ONNX Runtime (Intel macOS only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          brew install onnxruntime
          PREFIX="$(brew --prefix onnxruntime)"
          mkdir -p src-tauri/onnxruntime-libs
          # -L follows the version symlink and copies the real dylib.
          cp -L "$PREFIX/lib/libonnxruntime.dylib" src-tauri/onnxruntime-libs/libonnxruntime.dylib
          chmod u+w src-tauri/onnxruntime-libs/libonnxruntime.dylib
          install_name_tool -id @rpath/libonnxruntime.dylib src-tauri/onnxruntime-libs/libonnxruntime.dylib
          echo "ORT_STRATEGY=system" >> "$GITHUB_ENV"
          echo "ORT_LIB_LOCATION=$PWD/src-tauri/onnxruntime-libs" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      # Fetch the assets bundled as Tauri resources (the offline GGUF base.en
      # model and the MiniLM embedding model). Both are plain curl/fetch
      # downloads. The heavy verse-embedding pack is built lazily at runtime, so
      # it isn't fetched here.
      - name: Download bundled model assets
        run: |
          node scripts/download-gguf-model.mjs
          node scripts/download-embedding-model.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Selah v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          # Updater disabled for now (no signing key). Re-enable alongside
          # createUpdaterArtifacts in tauri.conf + the TAURI_SIGNING_* secrets.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} ${{ matrix.tauri_args }}

