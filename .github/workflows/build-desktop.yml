name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          # NOTE: Intel macOS (x86_64-apple-darwin) is intentionally omitted —
          # the ONNX Runtime backend (`ort`) ships no prebuilt binary for it, so
          # the native engine can't link without compiling ONNX Runtime from
          # source. Apple Silicon covers modern Macs.
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libvulkan-dev glslang-tools spirv-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Install the Vulkan SDK with a plain `run:` step (NOT a third-party
      # action). GitHub resolves every `uses:` action in a job up front — even
      # `if:`-gated ones and their nested actions — so a Vulkan setup *action*
      # (and its deprecated actions/cache@v2 dependency) breaks the macOS job
      # too. A `run:` step is gated by `if:` and never resolved on other OSes.
      - name: Setup Vulkan SDK (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = '1.3.290.0'
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      # Fetch the assets bundled as Tauri resources (the offline GGUF base.en
      # model and the MiniLM embedding model). Both are plain curl/fetch
      # downloads. The heavy verse-embedding pack is built lazily at runtime, so
      # it isn't fetched here.
      - name: Download bundled model assets
        run: |
          node scripts/download-gguf-model.mjs
          node scripts/download-embedding-model.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Selah v__VERSION__'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

