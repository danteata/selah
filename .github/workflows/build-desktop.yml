name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 0.1.0)'
        required: false

# tauri-action creates/updates the GitHub Release and uploads the bundles, which
# requires write access to repository contents (releases). Without this the
# default GITHUB_TOKEN is read-only and the upload fails with
# "Resource not accessible by integration".
permissions:
  contents: write
  # The publish job reads this run's per-matrix-job conclusions back from the
  # API. Naming any scope in this block drops every unnamed one to none, so
  # `actions: read` has to be explicit.
  actions: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            name: 'macOS (Apple Silicon)'
          # Intel macOS is CROSS-COMPILED from the Apple Silicon runner (no
          # scarce macos-13 Intel runner to queue on). Rust + the transcribe-cpp
          # C++ cross-compile to x86_64 fine; the only wrinkle is ONNX Runtime —
          # `ort` ships no x86_64-apple-darwin prebuilt and Microsoft/PyPI dropped
          # Intel-mac binaries at 1.24+, so the "x86_64 ONNX Runtime" step below
          # sources the x86_64 dylib from a Homebrew bottle. Bundled via the
          # config override.
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            name: 'macOS (Intel)'
            tauri_args: '--config src-tauri/tauri.onnxruntime-system.conf.json'
          # ubuntu-24.04 (glibc 2.39) is required: the prebuilt ONNX Runtime in
          # ort references __isoc23_strtol* symbols introduced in glibc 2.38, so
          # it can't link on ubuntu-22.04 (glibc 2.35).
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            name: 'Linux'
            # --verbose is load-bearing, not noise. tauri-bundler runs
            # linuxdeploy through output_ok(), which logs every stdout/stderr
            # line at log::debug! and then returns a bare
            # `failed to run linuxdeploy` that DISCARDS the captured output. At
            # default verbosity the AppImage step therefore fails with no
            # diagnostics whatsoever — which is exactly how v0.1.5 and v0.1.6
            # failed. Verbose is the only way linuxdeploy's actual error reaches
            # the log.
            tauri_args: '--verbose'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            name: 'Windows'
            # transcribe-cpp builds a runtime transcribe.dll + ggml backend DLLs
            # on Windows (dynamic-backends => shared). build.rs stages them into
            # src-tauri/windows-runtime/; this config maps them flat next to
            # Selah.exe so the installed app can load them (otherwise: "The code
            # execution cannot proceed because transcribe.dll was not found").
            tauri_args: '--config src-tauri/tauri.windows.conf.json'

    runs-on: ${{ matrix.platform }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          # whisper.cpp's Vulkan backend compiles its shaders with `glslc`, which
          # glslang-tools does NOT provide (that's only glslangValidator). The
          # LunarG `vulkan-sdk` meta-package bundles glslc + the loader + headers.
          # (noble = Ubuntu 24.04.)
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          # libfuse2: the AppImage tooling (linuxdeploy + its plugins, which are
          # themselves AppImages) mounts via FUSE 2 unless told to extract
          # instead. Kept as belt-and-braces, but note it is almost certainly NOT
          # what the "failed to run linuxdeploy" failures were about: the bundler
          # already passes --appimage-extract-and-run AND sets
          # APPIMAGE_EXTRACT_AND_RUN=1 on the child env itself
          # (crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs), so
          # the tooling never needs to mount anything. Don't spend another build
          # on the FUSE theory without evidence from a --verbose log.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev \
            libfuse2 \
            vulkan-sdk

      # AppImage bundling regressed with no code change: a newer ubuntu-24.04
      # runner image (post ~2026-06-15) ships
      # kernel.apparmor_restrict_unprivileged_userns=1, which blocks the AppImage
      # tooling's FUSE self-mount — linuxdeploy fails to even start ("failed to
      # run linuxdeploy" with zero output). It bundled fine on older images where
      # this restriction was off. Re-enable unprivileged user namespaces so
      # FUSE-based AppImage packaging works again. `|| true` so we don't fail if a
      # future image drops the knob (or it's already 0).
      - name: Allow unprivileged user namespaces for AppImage (Ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Activate the MSVC build environment so cl.exe + INCLUDE/LIB land on PATH.
      # whisper.cpp's Vulkan backend builds a host tool (vulkan-shaders-gen) via
      # a nested CMake ExternalProject; without the dev environment that nested
      # configure fails with "No CMAKE_C_COMPILER could be found". This action is
      # plain JS (no deprecated actions/cache), so resolving it doesn't break the
      # other jobs the way a Vulkan-setup action did.
      - name: Setup MSVC developer environment (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      # Two Windows-specific build settings for whisper.cpp's Vulkan backend:
      #
      # 1. CMAKE_GENERATOR=Ninja — the VS generator builds vulkan-shaders-gen as a
      #    nested CMake ExternalProject whose configure is re-invoked by MSBuild
      #    WITHOUT the VS toolset context ("No CMAKE_C_COMPILER could be found").
      #    Ninja uses cl.exe straight from PATH (from msvc-dev-cmd) for both the
      #    parent and nested builds.
      #
      # 2. CARGO_TARGET_DIR=C:\s — vulkan-shaders-gen's ExternalProject nests
      #    build dirs so deeply that the default target path pushes TryCompile PDB
      #    paths past Windows' 260-char MAX_PATH ("C1041: cannot open program
      #    database"). A short target root keeps every nested path under the limit.
      - name: Configure Windows build env (Ninja + short target dir)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CARGO_TARGET_DIR=C:\s" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Install the Vulkan SDK with a plain `run:` step (NOT a third-party
      # action). GitHub resolves every `uses:` action in a job up front — even
      # `if:`-gated ones and their nested actions — so a Vulkan setup *action*
      # (and its deprecated actions/cache@v2 dependency) breaks the macOS job
      # too. A `run:` step is gated by `if:` and never resolved on other OSes.
      - name: Setup Vulkan SDK (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = '1.3.290.0'
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Start-Process -FilePath $installer -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' -Wait
          "VULKAN_SDK=C:\VulkanSDK\$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\VulkanSDK\$ver\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # ggml's Vulkan backend calls `find_package(SPIRV-Headers CONFIG REQUIRED)`
      # (src/ggml-vulkan/CMakeLists.txt), which needs the SPIRV-Headers CMake
      # package-config files (SPIRV-HeadersConfig.cmake). The LunarG Vulkan SDK
      # ships the headers but NOT the CMake config, so the transcribe-cpp-sys
      # build fails with "Could not find a package configuration file provided
      # by SPIRV-Headers". We build+install the header-only SPIRV-Headers into
      # $VULKAN_SDK so CMAKE_PREFIX_PATH=$VULKAN_SDK (set by ggml) resolves it.
      - name: Install SPIRV-Headers CMake config (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = '1.3.290.0'
          $sdk = "C:\VulkanSDK\$ver"
          $tmp = "$env:RUNNER_TEMP\spirv-headers"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          # Tag matches the Vulkan SDK version (1.3.290.0).
          curl.exe -L -o "$tmp\src.tar.gz" "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-$ver.tar.gz"
          tar -xzf "$tmp\src.tar.gz" -C $tmp
          $src = Get-ChildItem -Directory "$tmp\SPIRV-Headers-*" | Select-Object -First 1
          if (-not $src) { throw "SPIRV-Headers source not found after extraction" }
          Write-Host "Installing SPIRV-Headers from $($src.FullName) into $sdk"
          # Header-only INTERFACE library; install drops SPIRV-HeadersConfig.cmake
          # under $sdk/share/cmake/SPIRV-Headers/, which CMAKE_PREFIX_PATH resolves.
          cmake -S "$($src.FullName)" -B "$tmp\build" -G Ninja `
            -DCMAKE_INSTALL_PREFIX="$sdk" `
            -DCMAKE_BUILD_TYPE=Release
          cmake --install "$tmp\build" --config Release

      # Cross-compiling x86_64 from the Apple Silicon runner needs an x86_64
      # libonnxruntime, but `ort` ships no x86_64-apple-darwin prebuilt and
      # Microsoft/PyPI dropped Intel-mac ONNX Runtime binaries at 1.24+. Homebrew
      # still builds an x86_64 bottle, so download that bottle directly (a plain
      # tarball — no need to install/run it under Rosetta) and extract the
      # self-contained dylib. `ort`'s system strategy links whatever is at
      # ORT_LIB_LOCATION with no version check, and a newer runtime (brew ships
      # 1.27.x) is ABI-compatible with the older API `ort` requests at runtime.
      # We give it an @rpath install-name so the bundled .app resolves it from
      # Contents/Frameworks (see tauri.onnxruntime-system.conf.json).
      # Insurance for the x86_64 cross-build: if any CMake try_run in the
      # transcribe-cpp/ggml build executes an x86_64 probe binary, Rosetta 2 lets
      # it run on this arm64 host. GitHub's arm64 runners usually ship Rosetta
      # already, so this is a fast no-op when present.
      - name: Ensure Rosetta 2 (Intel macOS cross-build only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Setup x86_64 ONNX Runtime (Intel macOS cross-build only)
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          # Source the x86_64 macOS libonnxruntime from conda-forge. It's the last
          # channel still building Intel-mac ONNX Runtime: `ort`/pyke ship no
          # x86_64-apple-darwin prebuilt, Microsoft + PyPI went arm64-only at 1.24,
          # and Homebrew's current formula has no x86_64 bottle on the runner.
          # conda-forge's onnxruntime-cpp osx-64 tops out at 1.22.2, which is fine:
          # ort-sys rc.12 requires only ORT_API_VERSION >= 17 (system strategy, no
          # build-time version pin), and 1.22.2 is API 22.
          #
          # micromamba with `--platform osx-64` resolves + downloads the Intel
          # package on this arm64 runner without running it. The resulting dylib
          # is self-contained apart from a conda `@rpath/libc++.1.dylib` reference,
          # which we retarget to the OS libc++ (ABI-stable, always present).
          curl -Ls https://micro.mamba.pm/api/micromamba/osx-arm64/latest | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          MAMBA="$RUNNER_TEMP/bin/micromamba"
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          "$MAMBA" create -y -p "$RUNNER_TEMP/ortenv" --platform osx-64 -c conda-forge onnxruntime-cpp
          # The versioned file is the real dylib (libonnxruntime.dylib is a symlink).
          dylib="$(find "$RUNNER_TEMP/ortenv/lib" -maxdepth 1 -type f -name 'libonnxruntime.*.dylib' | head -n1)"
          if [ -z "$dylib" ]; then
            echo "::error::libonnxruntime dylib not found in the conda-forge package"; exit 1
          fi
          lipo -archs "$dylib" | tr ' ' '\n' | grep -qx x86_64 || {
            echo "::error::conda-forge libonnxruntime is not x86_64 ($(lipo -archs "$dylib"))"; exit 1; }
          mkdir -p src-tauri/onnxruntime-libs
          cp "$dylib" src-tauri/onnxruntime-libs/libonnxruntime.dylib
          chmod u+w src-tauri/onnxruntime-libs/libonnxruntime.dylib
          install_name_tool -id @rpath/libonnxruntime.dylib src-tauri/onnxruntime-libs/libonnxruntime.dylib
          # Retarget conda's @rpath libc++ to the system one so the bundled dylib
          # has no non-system dependency to resolve. No-op if not present.
          install_name_tool -change @rpath/libc++.1.dylib /usr/lib/libc++.1.dylib src-tauri/onnxruntime-libs/libonnxruntime.dylib || true
          echo "Bundled x86_64 libonnxruntime dependencies:"; otool -L src-tauri/onnxruntime-libs/libonnxruntime.dylib
          echo "ORT_STRATEGY=system" >> "$GITHUB_ENV"
          echo "ORT_LIB_LOCATION=$PWD/src-tauri/onnxruntime-libs" >> "$GITHUB_ENV"
          # We supply a .dylib, but ort-sys defaults to static/xcframework linking
          # for a system lib dir and then fails ("can't do xcframework linking for
          # target 'x86_64-apple-darwin'" / "could not link to the ONNX Runtime
          # build"). Opt into dynamic linking so it links -lonnxruntime against our
          # dylib; the @rpath install-name resolves from the bundled .app framework
          # (tauri.onnxruntime-system.conf.json) at runtime.
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          # Force the transcribe-cpp/ggml CMake build to the x86_64 slice. The
          # `cmake` crate usually derives this from the target, but set it
          # explicitly so the cross-build can't silently produce arm64 objects.
          echo "TRANSCRIBE_CMAKE_ARGS=-DCMAKE_OSX_ARCHITECTURES=x86_64" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install

      # The npm `rc` config package installs an `rc` shim into node_modules/.bin,
      # which `bun`/`npm` prepend to PATH when running the build. On Windows that
      # shim SHADOWS the Windows SDK Resource Compiler (rc.exe), so CMake's link
      # step picks the wrong `rc` and fails: "LNK1104: cannot open manifest.res".
      # Removing the shim lets CMake find the real SDK rc.exe on PATH.
      - name: Remove rc shim shadowing the Windows SDK resource compiler (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path node_modules/.bin) {
            Get-ChildItem node_modules/.bin -Filter 'rc*' -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing shadowing shim: $($_.FullName)"
              Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
            }
          }

      # Fetch the assets bundled as Tauri resources (the offline GGUF base.en
      # model and the MiniLM embedding model). Both are plain curl/fetch
      # downloads. The heavy verse-embedding pack is built lazily at runtime, so
      # it isn't fetched here.
      - name: Download bundled model assets
        run: |
          node scripts/download-gguf-model.mjs
          node scripts/download-embedding-model.mjs

      # Vite inlines `import.meta.env.VITE_*` at build time. Without these the
      # desktop bundle ships an empty Clerk key and crashes on boot with
      # "@clerk/clerk-react: Missing publishableKey" (and Convex/analytics would
      # be misconfigured). GitHub leaves an undefined secret as an empty string,
      # so fail loudly here rather than shipping a broken app. These are all
      # publishable/client-side values (they end up in the bundle regardless).
      - name: Verify frontend build env is present
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
        run: |
          missing=0
          for v in VITE_CLERK_PUBLISHABLE_KEY VITE_CONVEX_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set — add it under repo Settings ▸ Secrets and variables ▸ Actions ▸ Secrets"
              missing=1
            fi
          done
          [ "$missing" = 0 ]

      - name: Read release notes
        id: relnotes
        shell: bash
        run: |
          {
            echo 'body<<RELNOTES_EOF'
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              echo 'See the assets to download and install this version.'
            fi
            echo 'RELNOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required now that createUpdaterArtifacts is on.
          # Set these repo secrets (tauri signer generate); the matching public
          # key is in tauri.conf.json's plugins.updater.pubkey.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Run the AppImage tooling (linuxdeploy + plugins) by extracting them
          # instead of FUSE-mounting — the GitHub runner sandbox can't always
          # mount FUSE even with libfuse2 present. No-op off Linux.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Frontend build-time config, inlined by Vite during `bun run build`
          # (tauri-action's beforeBuildCommand). All client-side/publishable.
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_ANALYTICS_PROVIDER: ${{ secrets.VITE_ANALYTICS_PROVIDER }}
          VITE_AMPLITUDE_KEY: ${{ secrets.VITE_AMPLITUDE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_PAYMENT_PROVIDER: ${{ secrets.VITE_PAYMENT_PROVIDER }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_FF_SERMON_LISTENER: ${{ secrets.VITE_FF_SERMON_LISTENER }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Selah v__VERSION__'
          releaseBody: ${{ steps.relnotes.outputs.body }}
          # Draft until every platform users run has uploaded — see the publish
          # job. Publishing on the FIRST matrix job to finish meant latest.json
          # advertised the new version while only the macOS assets existed, so
          # for the ~20 minutes until Windows finished, a Windows app checking
          # for updates failed with `None of the fallback platforms
          # ["windows-x86_64-nsis", "windows-x86_64"] were found in the response
          # platforms object`. Reproduced on 0.1.7. Drafts are invisible to
          # releases/latest, so installed apps keep seeing the previous version
          # until the whole release lands at once.
          #
          # tauri-action supports this across a matrix: with draft set it can't
          # look the release up by tag (the API won't return drafts that way), so
          # it lists all releases and matches on tag_name instead — see
          # getOrCreateRelease in tauri-action's src/create-release.ts.
          releaseDraft: true
          prerelease: false
          # Publishes latest.json + signed updater artifacts so installed apps
          # auto-update. Requires createUpdaterArtifacts in tauri.conf + the
          # TAURI_SIGNING_* secrets (set in the env above).
          includeUpdaterJson: true
          args: --target ${{ matrix.target }} ${{ matrix.tauri_args }}

      # Runs even when the bundle step failed — that is the whole point. Kept
      # because it is how "the AppImage step ran out of disk" was ruled out
      # (106G available, 27% used) after the deb/rpm/AppDir copies of a ~440 MB
      # resource payload made that look plausible. The real cause was a missing
      # libtranscribe.so.0; see src-tauri/build.rs. If disk is ever suspected
      # again, the answer is already in the log.
      - name: Report disk usage (Ubuntu only)
        if: ${{ always() && startsWith(matrix.platform, 'ubuntu') }}
        run: |
          df -h /
          echo "--- largest paths under the target dir ---"
          du -sh src-tauri/target/${{ matrix.target }}/release/bundle/* 2>/dev/null | sort -h || true
          du -sh src-tauri/target/${{ matrix.target }}/release 2>/dev/null || true


  # Flip the draft release to published once the platforms users actually run
  # have uploaded their bundles. Until this runs, releases/latest still serves
  # the previous version, so no installed app ever sees a manifest advertising
  # assets that don't exist yet.
  publish:
    needs: build
    # always(), because Linux is deliberately NOT required: it is the flakiest
    # leg and a strict gate would mean no release publishes at all while it is
    # broken. That also rules out `needs.build.result`, which is the aggregate
    # over every matrix leg and can't say WHICH one failed — hence the API read
    # below.
    if: ${{ always() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    name: Publish release
    steps:
      - name: Publish once macOS and Windows have uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          conclusions=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name | startswith("Build ")) | "\(.name)=\(.conclusion)"')
          echo "$conclusions"

          missing=0
          while IFS= read -r required; do
            if ! printf '%s\n' "$conclusions" | grep -qxF "$required=success"; then
              echo "::error::$required did not succeed — leaving the release a draft so the updater keeps serving the previous version"
              missing=1
            fi
          done <<'REQUIRED'
          Build macOS (Apple Silicon)
          Build macOS (Intel)
          Build Windows
          REQUIRED

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          # Linux is reported but never blocks. When its job starts passing its
          # bundles are already attached to this same release by then.
          if ! printf '%s\n' "$conclusions" | grep -qxF 'Build Linux=success'; then
            echo "::warning::Linux did not produce bundles — publishing without them"
          fi

          gh release edit "$TAG" --repo "$REPO" --draft=false
          echo "Published $TAG"
