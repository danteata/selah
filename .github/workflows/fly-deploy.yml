# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  # Every push to main went straight to production with nothing run first.
  # Typecheck and tests now gate the deploy. (Lint joins once its backlog is
  # cleared; today it would block every deploy.)
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Same version as the Dockerfile; `latest` has broken esbuild before.
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: npx tsc -b
      - run: npx vitest run

  deploy:
    name: Deploy app
    needs: verify
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v7
      # A release, not @master: a moving branch runs whatever lands on it next.
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
