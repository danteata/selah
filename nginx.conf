server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/xml application/xml+rss
               image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: any request that doesn't match a static file gets
    # index.html so the router can take over. The app routes on the hash, so
    # this also catches old path-style links (/join/…, /sso-callback), which
    # main.tsx folds into the hash on load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # The entry point must always be revalidated, or a browser keeps loading
    # an index.html that points at bundles from an old release.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashes everything under /assets/, so the name changes when
    # the content does and a year is safe. `^~` so the regex block below can't
    # take these requests over (regex locations otherwise win over a prefix).
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else in public/ keeps its name across releases — bibles,
    # hymns, dictionary manifests, ort.js, the VAD bundles. Cache for a day and
    # revalidate by ETag afterwards (a cheap 304). These were marked immutable
    # for 30 days, so a corrected file stayed stale in browsers for a month.
    location ~* \.(js|css|wasm|json|onnx|png|jpg|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        add_header Cache-Control "public";
    }
}
