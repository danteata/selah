server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any request that doesn't match a static file
    # gets served index.html so React Router can take over. This is
    # what makes /desktop-oauth-callback and /desktop-oauth-done
    # work — Clerk's OAuth redirect lands on those URLs as full
    # page loads, and the static server needs to hand them to the
    # React app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache the Vite-hashed asset bundles aggressively. Vite
    # content-hashes every asset, so a 1-year cache is safe — the
    # filename changes when the content does.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other static assets (bibles/, hymns/, *.wasm) are versioned
    # by content-hash in their filenames too, so a long cache is
    # safe. Without this they'd be re-fetched on every page load.
    location ~* \.(js|css|wasm|json|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Compress text responses.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm application/xml application/xml+rss
               image/svg+xml;
    gzip_min_length 1024;

    # Security headers. The CSP needs to match the values in
    # src-tauri/tauri.conf.json for the desktop build, but the
    # web build at selah.fly.dev has a different origin (the
    # browser, not tauri://) and doesn't need the Tauri-specific
    # allowances.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
