      <div id="f03-countdown-copy">

          <span class="cd03-w cd03-hl">on</span> <span class="cd03-w cd03-hl">time.</span>

      <div id="f03-countdown-laptop-label" class="cd03-label">Your laptop</div>
      <div id="f03-countdown-device">
        <div id="f03-countdown-screen">
          <div id="f03-countdown-crop">
            <img src="assets/studio-countdown-live.png" alt="" />
            <div id="f03-countdown-ring-a" class="cd03-ring"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById("f03-countdown-" + id);
        const stage = $("stage");
        const topbar = $("topbar");
        const roomLabel = $("room-label");
        const panel = $("panel");
        const headWords = $("head").querySelectorAll(".cd03-w");
        const rule = $("rule");
        const subWords = $("sub").querySelectorAll(".cd03-w");
        const laptopLabel = $("laptop-label");
        const device = $("device");
        const ringA = $("ring-a");
        const ringB = $("ring-b");

        const tl = gsap.timeline({ paused: true });

        // Camera: slow push under Scenes 1–2, then holds still for Scene 3.
        tl.fromTo(stage, { scale: 1 }, { scale: 1.018, duration: 5, ease: "sine.inOut" }, 0);

        // Scene 1 (0–2s): the room's screen establishes, headline lands beside it.
        tl.fromTo(topbar, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
        tl.fromTo(panel, { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.05);
        tl.fromTo(roomLabel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);
        tl.fromTo(
          headWords,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.16 },
          0.6,
        );
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.3);

        // Scene 2 (2–5s): the operator's screen slides in over the panel's corner.
        tl.fromTo(device, { opacity: 0, x: 240 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 2.0);
        tl.fromTo(laptopLabel, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.45);

        // Scene 3 (5–8s): second line arrives under the first; surfaces hold.
        tl.fromTo(
          subWords,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.18 },
          5.0,
        );

        // asr-keyword-glow: one linear driver, attack/sustain/release envelope.
        // Flat treatment per frame.md (no glow/shadow): envelope drives ring
        // opacity/scale on the Pause region and a color lerp on the key words.
        const ATTACK_DUR = 0.2;
        const RELEASE = 0.45;
        const REST_LEVEL = 0.3;
        const SCENE_DURATION = 8;
        const TIMINGS = {
          pause: { start: 3.1, end: 4.5 },
          here: { start: 5.55, end: 5.95 },
          there: { start: 6.3, end: 7.0 },
        };
        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          const releaseEnd = end + RELEASE;
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        const REST_RGB = { r: 255, g: 255, b: 255 };
        const ACTIVE_RGB = { r: 94, g: 234, b: 212 };
        const lerp = (a, b, t) => Math.round(a + (b - a) * t);
        const colorAt = (env) =>
          `rgb(${lerp(REST_RGB.r, ACTIVE_RGB.r, env)}, ${lerp(REST_RGB.g, ACTIVE_RGB.g, env)}, ${lerp(REST_RGB.b, ACTIVE_RGB.b, env)})`;
        const keyWords = $("sub").querySelectorAll("[data-word]");

        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: SCENE_DURATION,
            duration: SCENE_DURATION,
            ease: "none",
            onUpdate: () => {
              const p = TIMINGS.pause;
              const env = envelope(driver.t, p.start, p.end);
              const since = Math.max(0, Math.min(1, (driver.t - p.start) / 1.2));
              ringA.style.opacity = String(env);
              ringA.style.transform = `scale(${1 + 0.12 * env})`;
              ringB.style.opacity = String(driver.t < p.start ? 0 : (1 - since) * 0.8);
              ringB.style.transform = `scale(${1 + 0.9 * since})`;
              keyWords.forEach((el) => {
                const tm = TIMINGS[el.dataset.word];
                const e = envelope(driver.t, tm.start, tm.end);
                el.style.color = colorAt(e);
                el.style.transform = `scale(${1 + 0.06 * e})`;
              });
            },
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["03-countdown"] = tl;
      })();
    </script>
