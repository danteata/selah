  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {

    @font-face {

    @font-face {

    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      color: #ffffff;
    }
    #lw05-ground {
      position: absolute;
      inset: 0;
      background: #08090c;
    }

    /* ---- topbar (the spine) ---- */
    #lw05-topbar {
      position: absolute;
      left: 96px;
      right: 96px;
      top: 56px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 26px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #14b8a6;
    }
    #lw05-label {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    #lw05-dot {
      display: block;

    #lw05-rule {

    }

    /* ---- the transcript (display ramp, left, top two-thirds) ---- */
    #lw05-stage {
      position: absolute;

      width: 1728px;
      transform-origin: 0 0;
    }
    #lw05-line {
      font-family: "Crimson Pro", serif;

    }
    .lw05-word {
      display: inline-block;
      transform-origin: 50% 60%;

    }
    /* Not yet spoken: holds its place in the line, not drawn. */
    .lw05-rest {
      visibility: hidden;
    }
    #lw05-caret {
      display: inline-block;
      position: relative;
      width: 0;

    #lw05-caret-bar {

    #lw05-chip {

    /* ---- Scene 4: proof line + device ---- */
    #lw05-proof {
      position: absolute;
      left: 1064px;
      top: 150px;
      width: 760px;
      font-family: "DM Sans", sans-serif;
      font-weight: 400;
      font-size: 30px;
      line-height: 1.38;
      color: #ffffff;
    }
    #lw05-device {
      position: absolute;
      left: 1064px;
      top: 212px;
      width: 760px;
      height: 688px;
      padding: 12px;
      border: 2px solid #0d9488;
      border-radius: 8px;
      background: #12151b;
    }
    #lw05-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 6px;
      background: #08090c;
    }
    #lw05-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 732px;
      height: 660px;
      transform-origin: 0 0;
    }
    /* Crop: image-pixel window x 120–1800, y 160–1690 (the queue, Next Up and the
       Sermon Listener; the top bar with the account avatar stays out of frame). */
    #lw05-shot {
      position: absolute;
      left: -52px;
      top: -70px;
      width: 1255px;
      height: auto;
      display: block;
    }
    .lw05-target {
      position: absolute;
      border: 2px solid #fcd34d;
      border-radius: 8px;
    }
  </style>

  <div
    id="root"
    data-composition-id="05-live-words"
    data-start="0"
    data-duration="14.5"
    data-width="1920"
    data-height="1080"
  >
    <div id="lw05-ground" class="clip" data-start="0" data-duration="14.5" data-track-index="0"></div>

    <div id="lw05-content" class="clip" data-start="0" data-duration="14.5" data-track-index="1">
      <div id="lw05-topbar">
        <div id="lw05-label"><span id="lw05-dot"></span><span>Sermon Listener · Listening</span></div>
        <div id="lw05-counter">05</div>
      </div>
      <div id="lw05-rule"></div>

      <div id="lw05-stage">
        <div id="lw05-line"></div>
      </div>

      <div id="lw05-proof">Caught it the moment he said it.</div>

      <div id="lw05-device">
        <div id="lw05-viewport">
          <div id="lw05-cam">
            <img id="lw05-shot" src="assets/studio-listener-detect.png" alt="" />
            <!-- targets in viewport px: image px × 0.4358 − crop offset -->
            <div id="lw05-t-live" class="lw05-target" style="left: 22px; top: 442px; width: 208px; height: 188px"></div>
            <div id="lw05-t-listener" class="lw05-target" style="left: 262px; top: 283px; width: 238px; height: 392px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var ID = "05-live-words";
      var DUR = 14;
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };

      /* ---------- transcript: per-word spoken windows (seconds, frame-local) ---------- */
      // [text, start, typeDuration, isReference]
      var WORDS = [
        ["Good", 1.05, 0.16, false],
        ["morning", 1.3, 0.24, false],
        ["church.", 1.66, 0.24, false],
        ["Open", 2.6, 0.16, false],
        ["your", 2.86, 0.14, false],
        ["Bibles", 3.08, 0.22, false],
        ["with", 3.52, 0.14, false],
        ["me", 3.74, 0.1, false],
        ["to", 3.92, 0.1, false],
        ["John", 4.5, 0.2, true],
        ["chapter", 4.92, 0.28, true],
        ["three,", 5.42, 0.24, true],
        ["verse", 6.22, 0.24, true],
        ["sixteen.", 6.78, 0.5, true],
      ];
      var T_DETECT = 7.5; // "sixteen." has landed

      var line = q("#lw05-line");
      var caret = document.createElement("span");
      caret.id = "lw05-caret";
      var caretBar = document.createElement("span");
      caretBar.id = "lw05-caret-bar";
      caret.appendChild(caretBar);

      var wordEls = [];
      WORDS.forEach(function (w, i) {
        if (i > 0) line.appendChild(document.createTextNode(" "));
        var span = document.createElement("span");
        span.className = "lw05-word";
        var typed = document.createElement("span");
        var rest = document.createElement("span");
        rest.className = "lw05-rest";
        rest.textContent = w[0];
        span.appendChild(typed);
        span.appendChild(rest);
        line.appendChild(span);
        wordEls.push({ el: span, typed: typed, rest: rest, text: w[0], start: w[1], dur: w[2], ref: w[3] });
      });

      var chip = document.createElement("span");
      chip.id = "lw05-chip";
      chip.innerHTML = '<span id="lw05-chip-dot"></span><span>John 3:16 · Detected</span>';
      line.appendChild(chip);

      wordEls[0].el.insertBefore(caret, wordEls[0].typed);

      /* ---------- colour + glow helpers ---------- */
      function mixRgb(a, b, t) {
        return [
          Math.round(a[0] + (b[0] - a[0]) * t),
          Math.round(a[1] + (b[1] - a[1]) * t),
          Math.round(a[2] + (b[2] - a[2]) * t),
        ];
      }
      function clamp01(v) {
        return v < 0 ? 0 : v > 1 ? 1 : v;
      }
      var INK = [255, 255, 255];
      var GOLD = [252, 211, 77];

      // asr-keyword-glow envelope (default style) for the recognised span
      var ATTACK = 0.18;
      var SUSTAIN_END = 8.7;
      var RELEASE = 0.5;
      var REST_LEVEL = 0.25;
      var MAX_BLUR = 22;
      var MAX_SCALE = 0.012;
      function envelope(t, start, end) {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / ATTACK, 1);
        if (t < end + RELEASE) return 1 - ((t - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }

      // Change times for the caret's typing-grace (baked, seek-safe)
      var CHANGE_TIMES = [];
      wordEls.forEach(function (w) {
        var n = w.text.length;
        for (var c = 1; c <= n; c++) CHANGE_TIMES.push(w.start + (w.dur * (c - 1)) / n);
      });
      var TYPING_GRACE = 0.22;
      var BLINK_CYCLES = 16; // 14s / 16 ≈ 0.875s period, whole number

      function render(t) {
        // frontier = last word whose typing has started
        var frontier = -1;
        for (var i = 0; i < wordEls.length; i++) if (t >= wordEls[i].start) frontier = i;

        var refLit = clamp01((t - T_DETECT) / 0.35); // gold turn
        var dimOthers = clamp01((t - T_DETECT) / 0.4); // rest dims 70% -> 40%

        for (var j = 0; j < wordEls.length; j++) {
          var w = wordEls[j];
          var n = w.text.length;
          var shown = 0;
          if (t >= w.start) shown = Math.min(n, Math.floor(((t - w.start) / w.dur) * n) + 1);
          var vis = w.text.slice(0, shown);
          if (w.typed.textContent !== vis) w.typed.textContent = vis;
          var hid = w.text.slice(shown);
          if (w.rest.textContent !== hid) w.rest.textContent = hid;

          // spoken words 70% ink, frontier full ink
          var alpha = j === frontier ? 1 : 0.7;
          var rgb = INK;
          var glow = 0;
          if (t >= T_DETECT) {
            if (w.ref) {
              var idx = j - 9;
              var env = envelope(t, T_DETECT + idx * 0.06, SUSTAIN_END + idx * 0.06);
              glow = env;
              rgb = mixRgb(INK, GOLD, refLit);
              alpha = 0.7 + 0.3 * refLit;
            } else {
              alpha = 0.7 - 0.3 * dimOthers;
            }
          }
          w.el.style.color = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + alpha.toFixed(3) + ")";
          w.el.style.textShadow =
            glow > 0 ? "0 0 " + (MAX_BLUR * glow).toFixed(1) + "px rgba(252,211,77," + (0.55 * glow).toFixed(3) + ")" : "none";
          w.el.style.transform = "scale(" + (1 + MAX_SCALE * glow).toFixed(4) + ")";
        }

        // caret sits at the typing frontier (context-sensitive colour)
        var host = frontier < 0 ? wordEls[0] : wordEls[frontier];
        if (frontier < 0) {
          if (caret.parentNode !== host.el || caret.nextSibling !== host.typed) host.el.insertBefore(caret, host.typed);
        } else if (caret.parentNode !== host.el || caret.nextSibling !== host.rest) {
          host.el.insertBefore(caret, host.rest);
        }
        var caretGold = frontier >= 9;
        caretBar.style.background = caretGold ? "#FCD34D" : "#FFFFFF";

        var typing = false;
        for (var k = 0; k < CHANGE_TIMES.length; k++) {
          if (CHANGE_TIMES[k] <= t && t - CHANGE_TIMES[k] < TYPING_GRACE) {
            typing = true;
            break;
          }
        }
        var phase = (t / DUR) * Math.PI * 2 * BLINK_CYCLES;
        var on = typing || Math.sin(phase + Math.PI / 2) > 0;
        caret.style.opacity = on ? "1" : "0";

        // live dot breathes (deterministic)
        q("#lw05-dot").style.opacity = (0.55 + 0.45 * (0.5 + 0.5 * Math.cos((t / DUR) * Math.PI * 2 * 14))).toFixed(3);
      }

      /* ---------- timeline ---------- */
      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–1.0): label chrome + caret on an empty stage
      tl.fromTo("#lw05-label", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#lw05-counter", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo("#lw05-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.inOut" }, 0.1);

      // Scenes 2–3: one linear driver for typing, caret, keyword glow, dimming
      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );

      // Scene 3 (7.5–10.0): the detection chip pops beside the reference
      tl.fromTo(
        "#lw05-chip",
        { opacity: 0, scale: 0.82, x: -18 },
        { opacity: 1, scale: 1, x: 0, duration: 0.55, ease: "back.out(1.3)" },
        T_DETECT + 0.12,
      );

      // Scene 4 (10.0–14.0): transcript steps aside, the studio rises and zooms to the proof
      tl.fromTo(
        "#lw05-stage",
        { x: 0, y: 0, scale: 1 },
        { x: 0, y: 210, scale: 0.52, duration: 0.8, ease: "power3.out" },
        10.0,
      );
      tl.fromTo("#lw05-device", { y: 900, opacity: 0 }, { y: 0, opacity: 1, duration: 1.0, ease: "power3.out" }, 10.3);
      tl.fromTo("#lw05-proof", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 10.9);
      // zoom-to-target: frame the LIVE card + Sermon Listener panel
      tl.fromTo(
        "#lw05-cam",
        { x: 0, y: 0, scale: 1 },
        { x: 0, y: -338, scale: 1.4, duration: 1.4, ease: "power2.inOut" },
        11.3,
      );
      tl.fromTo(
        "#lw05-t-listener",
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        12.6,
      );
      tl.fromTo(
        "#lw05-t-live",
        { opacity: 0, scale: 1.06 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" },
        12.85,
      );

      render(0);
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
