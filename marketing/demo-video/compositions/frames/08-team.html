    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById("f08-team-" + id);
        const stage = $("stage");
        const topbar = $("topbar");
        const laptop = $("laptop");
        const phone = $("phone");
        const label = $("label");
        const headWords = $("head").querySelectorAll(".team08-w");
        const rule = $("rule");
        const subWords = $("sub").querySelectorAll(".team08-w");
        const laptopRing = $("laptop-ring");
        const phoneRing = $("phone-ring");
        const keyWords = $("sub").querySelectorAll("[data-word]");

        const tl = gsap.timeline({ paused: true });

        // Camera: slow, continuous micro-push across the whole shot.
        tl.fromTo(stage, { scale: 1 }, { scale: 1.02, duration: 10, ease: "sine.inOut" }, 0);

        // Scene 1 (0-3s): laptop establishes from the left; headline lands upper right.
        tl.fromTo(topbar, { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0);
        tl.fromTo(laptop, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, 0.05);
        tl.fromTo(label, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.45);
        tl.fromTo(
          headWords,
          { opacity: 0, y: 40 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.14 },
          0.6,
        );
        tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 1.4);

        // Scene 2 (3-6.5s): phone slides up over the laptop's edge; laptop recedes a touch.
        tl.fromTo(
          phone,
          { opacity: 0, y: 520, rotation: 5 },
          { opacity: 1, y: 0, rotation: 0, duration: 1.1, ease: "power3.out" },
          3.0,
        );
        tl.fromTo(laptop, { scale: 1 }, { scale: 0.975, duration: 1.1, ease: "power2.out", immediateRender: false }, 3.0);

        // Scene 3 (6.5-10s): second line arrives under the first; hold.
        tl.fromTo(
          subWords,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.14 },
          6.5,
        );

        // asr-keyword-glow: one linear driver with attack/sustain/release.
        // Flat per frame.md (no glow/shadow): the envelope drives ring opacity/scale
        // on the two session bars and a colour lerp + scale on the key words.
        const ATTACK_DUR = 0.2;
        const RELEASE = 0.5;
        const REST_LEVEL = 0.3;
        const SCENE_DURATION = 10;
        const TIMINGS = {
          laptop: { start: 1.8, end: 2.7 },
          phone: { start: 4.3, end: 5.8 },
          wphone: { start: 7.2, end: 7.7 },
          wlive: { start: 7.6, end: 8.4 },
        };
        function envelope(time, start, end) {
          if (time < start) return 0;
          if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
          const releaseEnd = end + RELEASE;
          if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
          return REST_LEVEL;
        }
        const lerp = (a, b, t) => Math.round(a + (b - a) * t);
        const colorAt = (e) => `rgb(${lerp(255, 94, e)}, ${lerp(255, 234, e)}, ${lerp(255, 212, e)})`;

        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: SCENE_DURATION,
            duration: SCENE_DURATION,
            ease: "none",
            onUpdate: () => {
              const eL = envelope(driver.t, TIMINGS.laptop.start, TIMINGS.laptop.end);
              laptopRing.style.opacity = String(eL);
              laptopRing.style.transform = `scale(${1 + 0.08 * eL})`;
              const eP = envelope(driver.t, TIMINGS.phone.start, TIMINGS.phone.end);
              phoneRing.style.opacity = String(eP);
              phoneRing.style.transform = `scale(${1 + 0.1 * eP})`;
              keyWords.forEach((el) => {
                const tm = TIMINGS["w" + el.dataset.word];
                const e = envelope(driver.t, tm.start, tm.end);
                el.style.color = colorAt(e);
                el.style.transform = `scale(${1 + 0.06 * e})`;
              });
            },
          },
          0,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["08-team"] = tl;
      })();
    </script>
