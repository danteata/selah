    <script>
      (function () {
        var scope = document.querySelector('[data-composition-id="02-intro"]') || document;
        var $ = function (id) {
          return scope.querySelector('[id="' + id + '"]');
        };
        var words = scope.querySelectorAll(".f02-intro-word");
        var tl = gsap.timeline({ paused: true });

        // Scene 1 (0.0-1.8s): line 1 pops in (smooth register); device rises from below the fold.
        tl.fromTo($("f02-intro-topbar"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo(
          $("f02-intro-line1"),
          { scale: 0, opacity: 0, y: 12 },
          { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          0.1
        );
        tl.fromTo($("f02-intro-device"), { y: 760 }, { y: 0, duration: 2.5, ease: "expo.out" }, 0.25);
        tl.fromTo($("f02-intro-plate"), { y: 800, opacity: 0 }, { y: 0, opacity: 1, duration: 2.7, ease: "expo.out" }, 0.35);

        // Scene 2 (1.8-4.2s): second line arrives word by word; rule draws; device settles with a slow push.
        words.forEach(function (el, i) {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0, y: 20 },
            { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            1.85 + i * 0.07
          );
        });
        tl.fromTo($("f02-intro-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 2.4);
        tl.fromTo($("f02-intro-device"), { scale: 1 }, { scale: 1.012, duration: 1.6, ease: "sine.inOut" }, 2.7);

        // Scene 3 (4.2-7.0s): coordinate-target-zoom onto the slide queue (countdown live, Amazing Grace expanded).
        // Target measured from the screenshot geometry (image is absolutely sized, so no font dependency):
        // queue column centre = (176.5, 196) in window px vs window centre (672, 274) -> offset (-495.5, -78).
        // T = -offset, clamped on x to 284 so the image's left edge never pulls inside the window at 1.75x.
        var ZOOM_AT = 4.3,
          ZOOM_DUR = 1.6,
          ZOOM_SCALE = 1.75;
        tl.fromTo(
          $("f02-intro-zoom-outer"),
          { scale: 1 },
          { scale: ZOOM_SCALE, duration: ZOOM_DUR, ease: "power3.inOut" },
          ZOOM_AT
        );
        tl.fromTo(
          $("f02-intro-zoom-inner"),
          { x: 0, y: 0 },
          { x: 284, y: 78, duration: ZOOM_DUR, ease: "power3.inOut" },
          ZOOM_AT
        );
        tl.fromTo($("f02-intro-head"), { opacity: 1 }, { opacity: 0.6, duration: 1.0, ease: "power2.out" }, ZOOM_AT);
        tl.fromTo($("f02-intro-rule"), { opacity: 1 }, { opacity: 0.6, duration: 1.0, ease: "power2.out" }, ZOOM_AT);
        // hold to 7.0s
        tl.to({}, { duration: 0.01 }, 6.99);

        window.__timelines = window.__timelines || {};
        window.__timelines["02-intro"] = tl;
