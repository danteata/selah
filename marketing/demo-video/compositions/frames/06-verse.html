<template>
  <div id="root" data-composition-id="06-verse" data-start="0" data-duration="8.5" data-width="1920" data-height="1080">
    <style>
      @font-face { font-family: "Crimson Pro"; src: url("assets/fonts/crimson-pro-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-style: normal; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        container-type: size;
      }
      #root * { box-sizing: border-box; margin: 0; padding: 0; }
      .w06-ground {
        position: absolute;
        inset: 0;
        background: #08090C;
      }
      .w06-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* Outer panel: full-bleed at rest, settles to a 1200x675 16:9 panel (scale 0.625) with top at y=214. */
      .w06-panel {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 50% 50%;
        border-radius: 0px;
      }
      /* Inner wrapper: the inverse zoom-through arrival, anchored on the reference line. */
      .w06-arrive {
        position: absolute;
        inset: 0;
        transform-origin: 955px 985px;
      }
      .w06-arrive img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      /* 3.2px / 12.8px at full size read as 2px / 8px once the panel is at 0.625. */
      .w06-frame {
        position: absolute;
        inset: 0;
        border: 3.2px solid #14B8A6;
        border-radius: 12.8px;
        opacity: 0;
      }
      .w06-topbar {
        position: absolute;
        left: 96px;

      .w06-chip {

      .w06-headwrap {

        height: 100px;

        justify-content: center;

      .w06-line {
        position: relative;
        font-family: "Crimson Pro", serif;
        font-weight: 600;
        font-size: 4.2cqw;
        line-height: 1.0;
        letter-spacing: -0.02em;
        color: #FFFFFF;
        white-space: nowrap;
        clip-path: inset(-30% 100% -30% -4%);
      }
      .w06-line span { display: inline; }
      /* Letters are coloured one by one (see the build script), mint to gold. */
      .w06-grad { color: #5EEAD4; }
      .w06-caret {
        position: absolute;
        top: 10px;

        height: 64px;
        background: #14B8A6;
        border-radius: 2px;
        opacity: 0;
      }
    </style>

    <div class="w06-ground clip" data-start="0" data-duration="8.5" data-track-index="0"></div>

    <div class="w06-stage clip" data-start="0" data-duration="8.5" data-track-index="1">
      <div class="w06-panel" id="w06-panel">
        <div class="w06-arrive" id="w06-arrive">
          <img src="assets/projector-john-3-16.png" alt="" />
        </div>
        <div class="w06-frame" id="w06-frame"></div>
      </div>
    </div>

    <div class="w06-topbar clip" data-start="0" data-duration="8.5" data-track-index="2">
      <div class="w06-chip" id="w06-chip-l"><b>06</b> &nbsp;Projector</div>
      <div class="w06-chip" id="w06-chip-r">John 3:16 &nbsp;<b>Live</b></div>
    </div>

    <div class="w06-headwrap clip" data-start="0" data-duration="8.5" data-track-index="3">
      <div class="w06-line" id="w06-line"></div>
      <div class="w06-caret" id="w06-caret"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        // ---- Build the headline as per-character spans (layout fixed; reveal is a clip, not reflow).
        const PLAIN = "On the screen before he has ";
        const GRAD = "turned the page.";
        const FULL = PLAIN + GRAD;
        const line = document.getElementById("w06-line");
        const caret = document.getElementById("w06-caret");
        const chars = [];
        function addChars(parent, str) {
          for (let i = 0; i < str.length; i++) {
            const s = document.createElement("span");
            s.textContent = str[i];
            parent.appendChild(s);
            chars.push(s);
          }
        }
        addChars(line, PLAIN);
        const grad = document.createElement("span");
        grad.className = "w06-grad";
        line.appendChild(grad);
        addChars(grad, GRAD);
        // Mint to gold (the landing hero's gradient), stepped letter by letter:
        // each letter gets its own solid colour, so nothing is transparent.
        const gradChars = grad.querySelectorAll("span");
        const MINT = [0x5e, 0xea, 0xd4], GOLD = [0xfc, 0xd3, 0x4d];
        gradChars.forEach(function (el, i) {
          const k = gradChars.length > 1 ? i / (gradChars.length - 1) : 0;
          const c = MINT.map(function (m, j) { return Math.round(m + (GOLD[j] - m) * k); });
          el.style.color = "rgb(" + c.join(",") + ")";
        });

        // ---- Typing schedule (discrete states: visible character count at time thresholds).
        // Scene 2: "On the screen" types in (13 chars), caret then idles through the pause.
        // Scene 3: " before he has " then a beat, then "turned the page."
        const SCHEDULE = [{ t: 0, n: 0 }];
        function typeRun(from, to, start, step) {
          for (let k = from + 1; k <= to; k++) SCHEDULE.push({ t: start + (k - from - 1) * step, n: k });
        }
        const N1 = "On the screen".length;              // 13
        const N2 = PLAIN.length;                         // through "has "
        typeRun(0, N1, 3.3, 0.068);
        typeRun(N1, N2, 5.0, 0.042);
        typeRun(N2, FULL.length, 5.0 + (N2 - N1) * 0.042 + 0.18, 0.046);
        const TYPE_END = SCHEDULE[SCHEDULE.length - 1].t;

        function countAt(t) {
          for (let i = SCHEDULE.length - 1; i >= 0; i--) if (t >= SCHEDULE[i].t) return SCHEDULE[i].n;
          return 0;
        }
        function lastKeyAt(t) {
          for (let i = SCHEDULE.length - 1; i >= 0; i--) if (t >= SCHEDULE[i].t) return SCHEDULE[i].t;
          return 0;
        }
        const glideEase = gsap.parseEase("power2.inOut");

        function render(t) {
          const n = countAt(t);
          const W = line.offsetWidth;
          const wAt = function (k) {
            if (k <= 0) return 0;
            const s = chars[k - 1];
            return s.offsetLeft + s.offsetWidth;
          };
          const x = wAt(n);
          // Scene 2 keeps "On the screen" centred; Scene 3 glides the line to its true centre as it completes.
          const w1 = wAt(N1);
          const g = glideEase(Math.min(1, Math.max(0, (t - 5.0) / (TYPE_END - 5.0 + 0.2))));
          const shift = (1 - g) * (W - w1) / 2;
          line.style.transform = "translateX(" + shift.toFixed(2) + "px)";
          line.style.clipPath = "inset(-30% " + Math.max(0, W - x).toFixed(2) + "px -30% -4%)";

          // Caret: sits after the frontier char; solid while typing, blinks in pauses, gone after the line lands.
          const lineLeft = line.offsetLeft;
          caret.style.left = (lineLeft + shift + x + 6).toFixed(2) + "px";
          let o = 0;
          if (t >= 3.0 && t < TYPE_END + 0.9) {
            const since = t - lastKeyAt(t);
            o = since < 0.35 ? 1 : (Math.sin((since - 0.35) * Math.PI * 2 / 0.9 + Math.PI / 2) >= 0 ? 1 : 0);
          }
          caret.style.opacity = o;
        }

        const tl = gsap.timeline({ paused: true });

        // Scene 1 (0-2.5): inverse zoom-through ARRIVAL onto the room's full-bleed view,
        // anchored on the gold reference line (full-frame surface: 18px peak blur).
        tl.fromTo("#w06-arrive",
          { scale: 1.25, filter: "blur(18px)" },
          { scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0);
        tl.fromTo("#w06-arrive", { opacity: 0.15 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);
        tl.to("#w06-arrive", { scale: 1.012, duration: 1.9, ease: "none" }, 0.6);

        // Scene 2 (2.5-5.0): the screen settles into a centred 16:9 panel; chrome arrives; "On the screen" types.
        tl.fromTo("#w06-panel",
          { scale: 1, y: 0, borderRadius: 0 },
          { scale: 0.625, y: 11.5, borderRadius: 12.8, duration: 1.0, ease: "power3.inOut" }, 2.5);
        tl.to("#w06-arrive", { scale: 1, duration: 1.0, ease: "power3.inOut" }, 2.5);
        tl.fromTo("#w06-frame", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.1);
        tl.fromTo(".w06-chip", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.1, ease: "power3.out" }, 2.8);

        // Typing driver (Scenes 2-3), one seek-safe onUpdate derived from time alone.
        const driver = { t: 0 };
        tl.fromTo(driver, { t: 0 }, {
          t: 8, duration: 8, ease: "none",
          onUpdate: function () { render(driver.t); }
        }, 0);

        // Scene 3 (5.0-8.0): the line completes, "turned the page." in mint-to-gold; then everything holds still.

        render(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["06-verse"] = tl;
      })();
    </script>
  </div>
</template>
