    <!-- full-bleed near-black ground -->

    <!-- chrome: topbar holds across the shot -->
    <div id="sunday01-topbar" class="clip sunday01-topbar" data-start="0" data-duration="6.4" data-track-index="1">

    <!-- Scene 1 (0.0-1.6s): "Sunday, 9:55." per-word staggered reveal -->
    <div id="sunday01-s1" class="clip sunday01-stage" data-start="0" data-duration="1.6" data-track-index="2">
      <div class="sunday01-line sunday01-display">
        <span class="sunday01-word" id="sunday01-w-sunday">Sunday,</span>

    <!-- Scene 2 (1.6-3.6s): hard-cut swap, words land one per beat, left to right -->
    <div id="sunday01-s2" class="clip sunday01-stage" data-start="1.6" data-duration="2" data-track-index="2">
      <div class="sunday01-line sunday01-display">

        <span class="sunday01-word" id="sunday01-w-scripture">Scripture.</span>

    <!-- Scene 3 (3.6-6.0s): hard-cut to the held line -->
    <div id="sunday01-s3" class="clip sunday01-stage" data-start="3.6" data-duration="2.8" data-track-index="2">
      <div class="sunday01-block" id="sunday01-s3-block">
        <div class="sunday01-line sunday01-headline">
          <span class="sunday01-green-lite">One volunteer</span> at the laptop.
        </div>
        <div id="sunday01-rule"></div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const TOTAL = 6;

        // Scene 1 — per-word staggered fade/blur reveal (dynamic-content-sequencing beat 1)
        tl.fromTo(
          "#sunday01-w-sunday",
          { opacity: 0, y: 28, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
          0.05
        );
        tl.fromTo(
          "#sunday01-w-time",
          { opacity: 0, y: 28, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" },
          0.42
        );

        // Scene 2 — discrete-text-sequence: whole states swap instantly at thresholds.
        // Words keep their layout slots (visibility, not removal) so the line never re-centers.
        const WORDS = [
          document.getElementById("sunday01-w-songs"),
          document.getElementById("sunday01-w-scripture"),
          document.getElementById("sunday01-w-notices"),
        ];
        const SEQUENCE = [
          { t: 0.0, shown: 0 },
          { t: 1.6, shown: 1 }, // hard cut: "Songs." lands with the swap
          { t: 2.25, shown: 2 }, // "Scripture."
          { t: 2.9, shown: 3 }, // "Notices."
          // Hard cut to Scene 3: hide them again. A word's own visibility:visible
          // outranks its line being hidden, so they stayed under the next line.
          { t: 3.6, shown: 0 },
        ];
        function stateAt(time) {
          for (let i = SEQUENCE.length - 1; i >= 0; i--) {
            if (time >= SEQUENCE[i].t) return SEQUENCE[i].shown;
          }
          return 0;
        }
        function render(shown) {
          for (let i = 0; i < WORDS.length; i++) {
            WORDS[i].style.visibility = i < shown ? "visible" : "hidden";
          }
        }
        render(0);
        let lastShown = -1;
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: TOTAL,
            duration: TOTAL,
            ease: "none",
            onUpdate: function () {
              const shown = stateAt(driver.t);
              if (shown !== lastShown) {
                render(shown);
                lastShown = shown;
              }
            },
          },
          0
        );
        // tiny landing settle on each word (the appearance itself is instant)
        [1.6, 2.25, 2.9].forEach(function (t, i) {
          tl.fromTo(WORDS[i], { scale: 1.06 }, { scale: 1, duration: 0.22, ease: "power2.out" }, t);
        });

        // Scene 3 — hard cut in, settle, then hold still; a hairline draws under the held line
        tl.fromTo(
          "#sunday01-s3-block",
          { scale: 1.03 },
          { scale: 1, duration: 0.7, ease: "power2.out" },
          3.6
        );
        tl.fromTo(
          "#sunday01-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 1.2, ease: "power2.inOut" },
          4.1
        );

        // pad the timeline to the full frame length
        tl.set({}, {}, TOTAL);

        window.__timelines["01-sunday"] = tl;
      })();
    </script>
